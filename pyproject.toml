[project]
name = "payments-cdc-pipeline"
version = "0.1.0"
description = "Change data capture for a payments ledger: MySQL, Debezium, Kafka Connect, Postgres."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack running (make up && make register)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The repo has an airflow/ folder for DAGs; the import means the library.
known-third-party = ["airflow"]
