name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration" -q
      - name: Connector configs are valid JSON
        run: for f in connectors/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/payments-cdc
      - run: helm template t deploy/helm/payments-cdc > /dev/null
      - run: helm template t deploy/helm/payments-cdc --set strimzi.enabled=true > /dev/null
      - run: helm template t deploy/helm/payments-cdc --set reconcile.enabled=true > /dev/null

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Airflow
        run: |
          pip install "apache-airflow==2.9.3" pymysql psycopg2-binary \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"
      - name: DAG imports cleanly
        env:
          PYTHONPATH: src
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate > /dev/null
          python -c "
          from airflow.models import DagBag
          bag = DagBag('airflow/dags', include_examples=False)
          assert not bag.import_errors, bag.import_errors
          assert 'reconcile_payments_cdc' in bag.dag_ids
          print('DAGs:', bag.dag_ids)
          "

  integration:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Generate credentials
        run: |
          ./scripts/init_env.sh
          grep -E '^[A-Z_]+=' .env >> "$GITHUB_ENV"
      - name: Start stack
        run: docker compose up -d --build --wait mysql kafka postgres connect consumer
      - name: Register connectors
        run: ./scripts/register_connectors.sh
      - name: End-to-end test
        env:
          RUN_INTEGRATION: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3307"
          PG_HOST: 127.0.0.1
          PG_PORT: "5433"
        run: pytest -m integration -v
      - name: Logs on failure
        if: failure()
        run: |
          curl -s "localhost:8083/connectors?expand=status" || true
          docker compose logs --no-color connect consumer | tail -300
      - name: Stop stack
        if: always()
        run: docker compose down -v
