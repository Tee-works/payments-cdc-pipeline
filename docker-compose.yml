# Local stack: MySQL (source) -> Debezium on Kafka Connect -> Kafka -> Postgres (sink)
# plus the Python consumer that builds the status history.
#
#   make demo      start everything, register connectors, generate traffic, reconcile
#   make down      stop and delete volumes
#
# Credentials come from .env (generated from .env.example by `make`; git ignores it).

x-app: &app
  build: .
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    MYSQL_HOST: mysql
    PG_HOST: postgres
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run make to create .env}
    PG_USER: ${PG_USER:?run make to create .env}
    PG_PASSWORD: ${PG_PASSWORD:?run make to create .env}
    TZ: UTC

services:
  mysql:
    image: mysql:8.0
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run make to create .env}
      # Read by mysql/init/02_users.sh to create the debezium and app users.
      MYSQL_DEBEZIUM_PASSWORD: ${MYSQL_DEBEZIUM_PASSWORD:?run make to create .env}
      MYSQL_APP_PASSWORD: ${MYSQL_PASSWORD:?run make to create .env}
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    image: quay.io/debezium/connect:2.7
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: payments-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # Connector configs say ${env:NAME} instead of holding passwords; the
      # worker resolves them from its own environment at runtime.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      MYSQL_DEBEZIUM_PASSWORD: ${MYSQL_DEBEZIUM_PASSWORD:?run make to create .env}
      PG_USER: ${PG_USER:?run make to create .env}
      PG_PASSWORD: ${PG_PASSWORD:?run make to create .env}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 5s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:?run make to create .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run make to create .env}
      POSTGRES_DB: warehouse
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 30

  consumer:
    <<: *app
    command: ["python", "-m", "cdc.consumer"]
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Optional: Airflow running the daily reconciliation DAG.
  #   docker compose --profile airflow up -d airflow   (UI on http://localhost:8080)
  airflow:
    image: apache/airflow:2.9.3-python3.11
    profiles: ["airflow"]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "pymysql==1.1.1 psycopg2-binary"
      PYTHONPATH: /opt/airflow/src
      MYSQL_HOST: mysql
      PG_HOST: postgres
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run make to create .env}
      PG_USER: ${PG_USER:?run make to create .env}
      PG_PASSWORD: ${PG_PASSWORD:?run make to create .env}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
