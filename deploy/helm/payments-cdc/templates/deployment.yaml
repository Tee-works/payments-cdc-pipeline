apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payments-cdc.fullname" . }}
  labels:
    {{- include "payments-cdc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "payments-cdc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payments-cdc.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Give the consumer time to finish its batch and commit offsets on SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "cdc.consumer"]
          envFrom:
            - configMapRef:
                name: {{ include "payments-cdc.fullname" . }}
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
