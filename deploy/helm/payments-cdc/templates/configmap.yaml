apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments-cdc.fullname" . }}
  labels:
    {{- include "payments-cdc.labels" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP: {{ .Values.kafka.bootstrapServers | quote }}
  CONSUMER_GROUP: {{ .Values.kafka.consumerGroup | quote }}
  SOURCE_TOPIC: {{ .Values.kafka.sourceTopic | quote }}
  DLQ_TOPIC: {{ .Values.kafka.dlqTopic | quote }}
  PG_HOST: {{ .Values.postgres.host | quote }}
  PG_PORT: {{ .Values.postgres.port | quote }}
  PG_DB: {{ .Values.postgres.database | quote }}
